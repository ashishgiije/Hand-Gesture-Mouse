<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Hand Gesture Mouse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.animated-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

.content {
    position: relative;
    text-align: center;
    top: 40%;
    font-size: 24px;
}

.particle {
    position: absolute;
    background-color: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    opacity: 0.8;
    animation: float 8s infinite linear;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(0.5); }
    100% { transform: translateY(-10vh) scale(1.2); }
}

/* Navigation Panel */
nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(0, 0, 0, 0.8);
    padding: 15px 0;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

nav a {
    text-decoration: none;
    color: #00c3ff;
    font-size: 18px;
    padding: 10px 20px;
    transition: 0.3s;
}

nav a:hover {
    color: #ff00cc;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    margin: 0;
    padding: 0;
    transition: background 0.5s ease-in-out;
}

h1 {
    font-size: 2.5rem;
    margin-top: 20px;
}

.fade-in {
    animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.btn {
    display: inline-block;
    padding: 15px 30px;
    font-size: 1.2rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
    margin: 20px;
}

.start {
    background-color: #28a745;
    color: white;
}

.stop {
    background-color: #dc3545;
    color: white;
}

.btn:hover {
    transform: scale(1.1);
}

footer {
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    margin-top: 320px;
}

footer a {
    color: #00d9ff;
    text-decoration: none;
    margin: 0 10px;
}

footer a:hover {
    text-decoration: underline;
}

    /* Button Styles */
.btn {
    display: inline-block;
    padding: 15px 40px;
    font-size: 1.3rem;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    margin: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
}

/* Container */
.container {
    margin-top: 120px;
}


/* Start Button */
.start {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
}

.start:hover {
    background: linear-gradient(135deg, #0072ff, #00c6ff);
    transform: scale(1.1);
    box-shadow: 0 6px 15px rgba(0, 114, 255, 0.5);
}

/* Stop Button */
.stop {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
}

.stop:hover {
    background: linear-gradient(135deg, #ff4b2b, #ff416c);
    transform: scale(1.1);
    box-shadow: 0 6px 15px rgba(255, 75, 43, 0.5);
}

/* Button Ripple Effect */
.btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300%;
    height: 300%;
    background: rgba(255, 255, 255, 0.2);
    transition: width 0.4s ease-in-out, height 0.4s ease-in-out, top 0.4s ease-in-out, left 0.4s ease-in-out;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    opacity: 0;
}

.btn:hover::before {
    width: 0;
    height: 0;
    opacity: 1;
}

    /* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.8);
    padding: 15px 30px;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 1.8rem;
    font-weight: bold;
    color: #00c6ff;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
    padding: 0;
}

.nav-links li {
    display: inline;
}

.nav-links a {
    text-decoration: none;
    color: white;
    font-size: 1.2rem;
    transition: color 0.3s ease-in-out;
}

.nav-links a:hover {
    color: #ff4b2b;
}

/* Responsive Menu Toggle */
.menu-toggle {
    display: none;
    font-size: 2rem;
    cursor: pointer;
    color: white;
}
    /* Responsive Design */
@media (max-width: 768px) {
    .nav-links {
        display: none;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.9);
        position: absolute;
        top: 60px;
        right: 0;
        width: 50%;
        text-align: center;
        padding: 20px 0;
    }

    .nav-links li {
        display: block;
        padding: 10px 0;
    }

    .menu-toggle {
        display: block;
    }
}


</style>
<body>
<div class="animated-bg"></div>
    <div class="content">

  <header>
        <h1 class="fade-in"> </h1>
    </header>

  <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">Gesture Mouse</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Tutorial</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="http://localhost/loginpage/login_system/">logout</a></li>
        </ul>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1 class="fade-in">Dynamic Hand Gesture </h1>
        <button class="btn start" onclick="startGestureControl()">Start</button>
        <button class="btn stop" onclick="stopGestureControl()">Stop</button>
    </div>



    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Dynamic Hand Gesture Mouse | <a href="#">Privacy Policy</a></p>
    </footer>
</div>

    <script>

        document.addEventListener("DOMContentLoaded", function () {
    const bg = document.querySelector(".animated-bg");

    function createParticle() {
        const particle = document.createElement("div");
        particle.classList.add("particle");

        let size = Math.random() * 10 + 5; // Random size
        let left = Math.random() * 100; // Random position

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${left}vw`;

        bg.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 8000);
    }

    setInterval(createParticle, 200);
});


        function toggleMenu() {
    const nav = document.querySelector('.nav-links');
    nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
}

        function startGestureControl() {
            fetch('/start-script', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error('Error:', error));
        }

        function stopGestureControl() {
            fetch('/stop-script', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error('Error:', error));
        }
        // Page Load Animation
document.addEventListener("DOMContentLoaded", function() {
    document.body.style.background = "linear-gradient(to right, #1e3c72, #2a5298)";
});
    </script>

</body>
</html>
